<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 424">
  <rect x="0" y="0" width="1280" height="424" fill="#ffffff"/>
  <text x="60" y="44" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#1a202c">Task Panel 架构</text>
  <text x="60" y="78" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80">单 Node 进程 · 单端口 · 零原生依赖 —— 浏览器 ⇄ REST/WS ⇄ 状态机 ⇄ pi 子进程</text>

  <!-- 浏览器 UI（灰） -->
  <rect x="60" y="140" width="250" height="110" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="185" y="176" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">浏览器 UI</text>
  <text x="185" y="210" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">React · 看板 / 全过程 / Ctrl+K</text>

  <!-- 单 Node 进程（灰） -->
  <rect x="363" y="140" width="250" height="110" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="488" y="176" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">单 Node 进程</text>
  <text x="488" y="210" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">REST + WS + SQLite · 单端口 8787</text>

  <!-- 调度器（绿：确定性） -->
  <rect x="666" y="140" width="250" height="110" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="791" y="176" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">调度器</text>
  <text x="791" y="210" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">状态机 · 抢占 · 断点恢复</text>

  <!-- pi 子进程（橙：LLM 步骤，唯一强调） -->
  <rect x="969" y="140" width="250" height="110" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="1094" y="176" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">pi 子进程</text>
  <text x="1094" y="210" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">每任务一个 · rpc 模式 · 工作区</text>

  <!-- 箭头：UI ⇄ 进程（双向，上下两条） -->
  <line x1="310" y1="185" x2="349" y2="185" stroke="#718096" stroke-width="2.5"/>
  <polygon points="349,178 349,192 363,185" fill="#718096"/>
  <line x1="363" y1="215" x2="324" y2="215" stroke="#718096" stroke-width="2.5"/>
  <polygon points="324,208 324,222 310,215" fill="#718096"/>
  <!-- 进程 → 调度器 → 子进程 -->
  <line x1="613" y1="195" x2="652" y2="195" stroke="#718096" stroke-width="2.5"/>
  <polygon points="652,188 652,202 666,195" fill="#718096"/>
  <line x1="916" y1="195" x2="955" y2="195" stroke="#718096" stroke-width="2.5"/>
  <polygon points="955,188 955,202 969,195" fill="#718096"/>

  <!-- 缝隙标签（盒子下方） -->
  <text x="336" y="272" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">请求 / 事件流</text>
  <text x="639" y="272" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">调度</text>
  <text x="942" y="272" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">spawn / rpc</text>

  <!-- 事件回流（虚线）：子进程底部中心 → 进程底部中心 -->
  <path d="M 1094 250 L 1094 380 L 488 380 L 488 264" fill="none" stroke="#718096" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="480,264 496,264 488,250" fill="#718096"/>
  <text x="791" y="370" font-family="'Noto Sans CJK SC','Noto Sans','Microsoft YaHei',sans-serif" font-size="15" fill="#5a6a80" text-anchor="middle">事件流：seq 单调 · 断线重放（since）· 全量消息落库</text>
</svg>
