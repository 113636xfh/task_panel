<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>Task Panel</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('tp-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var _fs = localStorage.getItem('tp-fs');
        if (_fs) document.documentElement.dataset.fs = _fs;
        var _ac = localStorage.getItem('tp-accent');
        if (_ac) document.documentElement.dataset.accent = _ac;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/src/main.tsx"></script>
  </body>
</html>
